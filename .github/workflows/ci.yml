name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:ocr
      - uses: actions/upload-artifact@v4
        if: always() && hashFiles('coverage/**') != ''
        with:
          name: node-coverage
          path: coverage

  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml
    steps:
      - uses: actions/checkout@v4
      - id: present
        working-directory: .
        run: echo "ml=$([ -f ml/pyproject.toml ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: astral-sh/setup-uv@v6
        if: steps.present.outputs.ml == 'true'
        with:
          enable-cache: true
      - run: uv sync --all-groups
        if: steps.present.outputs.ml == 'true'
      - run: uv run ruff check .
        if: steps.present.outputs.ml == 'true'
      - run: uv run pyright
        if: steps.present.outputs.ml == 'true'
      - run: uv run pytest
        if: steps.present.outputs.ml == 'true'
      - uses: actions/upload-artifact@v4
        if: always() && hashFiles('ml/htmlcov/**') != ''
        with:
          name: python-coverage
          path: ml/htmlcov
