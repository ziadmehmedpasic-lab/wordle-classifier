[project]
name = "spoiler-ml"
version = "0.1.0"
description = "Data, training, evaluation and serving for the Wordle spoiler classifier"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.0",
    "httpx>=0.27",
    "numpy>=2.0",
    "peft>=0.15",
    "plotly>=5.24",
    "pydantic>=2.7",
    "torch>=2.4",
    "tqdm>=4.66",
    "transformers>=4.51",
    "tyro>=0.9",
]

[dependency-groups]
dev = [
    "pyright>=1.1.390",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
]

# cpu wheels on linux (ci); the default macos wheel is already cpu/mps
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["spoiler"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=spoiler --cov=scripts --cov-branch --cov-report=term-missing --cov-report=html --cov-fail-under=100"

[tool.coverage.report]
exclude_also = ['if __name__ == "__main__":']

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
include = ["spoiler", "scripts", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
